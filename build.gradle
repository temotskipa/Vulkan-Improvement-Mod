import groovy.json.JsonSlurper

import java.util.concurrent.TimeUnit

plugins {
    id 'net.fabricmc.fabric-loom' version '1.18-SNAPSHOT'
    id 'maven-publish'
}

version = project.mod_version
group = project.maven_group

base {
    archivesName = project.archives_base_name
}

// As Minecraft's launcher starts the game: native access, which the mod needs to reach mapped GPU
// memory, and the export LWJGL's memory backend uses.
List<String> gameJvmArguments = ["--enable-native-access=ALL-UNNAMED", "--add-exports=java.base/jdk.internal.misc=ALL-UNNAMED"]

loom {
    splitEnvironmentSourceSets()

    mods {
        "vulkanimprovement" {
            sourceSet "main"
            sourceSet "client"
        }
    }

    runs {
        configureEach {
            // The 26.4 launcher metadata starts the game with this and Loom does not pass it
            // on. Without it shaderc overflows the stack of the thread that compiles a shader
            // and the client dies at startup with an access violation and no JVM error file.
            jvmArguments.add("-XX:StackShadowPages=32")
            jvmArguments.addAll(gameJvmArguments)
        }
    }
}


repositories {
    // Add repositories to retrieve artifacts from in here.
    // You should only use this when depending on other mods because
    // Loom adds the essential maven repositories to download Minecraft and libraries from automatically.
    // See https://docs.gradle.org/current/userguide/declaring_repositories.html
    // for more information about repositories.
}

dependencies {
    // To change the versions see the gradle.properties file
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    implementation "net.fabricmc:fabric-loader:${project.loader_version}"

    implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"
}

sourceSets {
    client {
        resources.srcDir(layout.buildDirectory.dir("generated/resources/shader-spirv"))
    }
    test {
        compileClasspath += sourceSets.client.output
        runtimeClasspath += sourceSets.client.output
    }
}

processResources {
    inputs.property "version", project.version
    inputs.property "minecraft_dependency", project.minecraft_dependency
    inputs.property "loader_version", project.loader_version
    filteringCharset = "UTF-8"

    filesMatching("fabric.mod.json") {
        expand "version": project.version,
                "minecraft_dependency": project.minecraft_dependency,
                "loader_version": project.loader_version
    }
}

def requiredRepoDocs = ["AGENTS.md",
                        "ARCHITECTURE.md",
                        "docs/index.md",
                        "docs/PLANS.md",
                        "docs/RELIABILITY.md",
                        "docs/SECURITY.md",
                        "docs/design-docs/index.md",
                        "docs/design-docs/core-beliefs.md",
                        "docs/exec-plans/active/README.md",
                        "docs/exec-plans/tech-debt-tracker.md",
                        "docs/product-specs/index.md"]

tasks.register("checkRepoDocs") {
    group = "verification"
    description = "Validates the repository knowledge map and local documentation links."

    inputs.files(requiredRepoDocs.collect { layout.projectDirectory.file(it) })
    inputs.files(fileTree(dir: "docs", include: "**/*.md"))

    doLast {
        def missingDocs = requiredRepoDocs.findAll { !layout.projectDirectory.file(it).asFile.isFile() }
        if (!missingDocs.isEmpty()) {
            throw new GradleException("Missing required repository docs: ${missingDocs.join(', ')}")
        }

        def agentLines = layout.projectDirectory.file("AGENTS.md").asFile.readLines("UTF-8")
        if (agentLines.size() > 140) {
            throw new GradleException("AGENTS.md should stay concise; found ${agentLines.size()} lines, maximum is 140.")
        }

        def markdownFiles = ([layout.projectDirectory.file("AGENTS.md").asFile,
                              layout.projectDirectory.file("ARCHITECTURE.md").asFile] + fileTree(dir: "docs", include: "**/*.md").files).unique()
        def headingFailures = []
        def brokenLinks = []
        def linkPattern = ~/\[[^]]+]\(([^)]+)\)/

        markdownFiles.each { markdownFile ->
            def lines = markdownFile.readLines("UTF-8")
            def firstContentLine = lines.find { !it.trim().isEmpty() }
            if (firstContentLine == null || !firstContentLine.startsWith("# ")) {
                headingFailures.add(project.relativePath(markdownFile))
            }

            lines.each { line ->
                def matcher = line =~ linkPattern
                matcher.each { match ->
                    String target = match[1]
                    // A link with a scheme, such as a web or mail address, or to a heading of the same file.
                    def externalLink = target ==~ /[a-z]+:.*/ || target.startsWith("#")
                    if (!externalLink) {
                        def pathOnly = target.split("#", 2)[0]
                        if (!pathOnly.isEmpty()) {
                            def resolvedTarget = markdownFile.parentFile.toPath().resolve(pathOnly).normalize().toFile()
                            if (!resolvedTarget.exists()) {
                                brokenLinks.add("${project.relativePath(markdownFile)} -> ${target}")
                            }
                        }
                    }
                }
            }
        }

        if (!headingFailures.isEmpty()) {
            throw new GradleException("Markdown files must start with a level-one heading: ${headingFailures.join(', ')}")
        }

        if (!brokenLinks.isEmpty()) {
            throw new GradleException("Broken local documentation links: ${brokenLinks.join(', ')}")
        }
    }
}

def clientMixinConfig = layout.projectDirectory.file("src/client/resources/vulkanimprovement.client.mixins.json")
def clientMixinSourceDir = layout.projectDirectory.dir("src/client/java/com/temotskipa/vulkanimprovement/mixin/client")
def vulkanSourceDir = layout.projectDirectory.dir("src/client/java/com/temotskipa/vulkanimprovement/client/vulkan")
def vulkanPackageRoot = "com.temotskipa.vulkanimprovement.client.vulkan"
def allowedVulkanPackages = [
        vulkanPackageRoot + ".device",
        vulkanPackageRoot + ".gpu",
        vulkanPackageRoot + ".gpuworld",
        vulkanPackageRoot + ".model",
        vulkanPackageRoot + ".presentation",
        vulkanPackageRoot + ".rtpt",
        vulkanPackageRoot + ".runtime",
        vulkanPackageRoot + ".terrain",
        vulkanPackageRoot + ".terrain.util",
]
def shaderSourceRoot = layout.projectDirectory.dir("src/client/resources/assets/vulkanimprovement/shaders")
def terrainShaderSourceDir = shaderSourceRoot.dir("terrain")
def modelShaderSourceDir = shaderSourceRoot.dir("model")
def terrainGpuLayoutSource = layout.projectDirectory.file("src/client/java/com/temotskipa/vulkanimprovement/client/vulkan/terrain/util/TerrainGpuLayout.java")
def requireShaderValidator = providers.gradleProperty("vim.requireShaderValidator")
        .map { it.toBoolean() }
        .orElse(false)
def releaseBuild = providers.gradleProperty("vim.releaseBuild")
        .map { it.toBoolean() }
        .orElse(false)
def requireShaderValidatorTool = {
    releaseBuild.get() || requireShaderValidator.get()
}

tasks.register("checkClientMixinConfig") {
    group = "verification"
    description = "Validates that client mixin config entries match client mixin source files."

    inputs.file(clientMixinConfig)
    inputs.files(fileTree(dir: clientMixinSourceDir, include: "*.java"))

    doLast {
        def configFile = clientMixinConfig.asFile
        def sourceDir = clientMixinSourceDir.asFile
        if (!configFile.isFile()) {
            throw new GradleException("Missing client mixin config: ${project.relativePath(configFile)}")
        }
        if (!sourceDir.isDirectory()) {
            throw new GradleException("Missing client mixin source directory: ${project.relativePath(sourceDir)}")
        }

        def config = new JsonSlurper().parse(configFile)
        def mixinPackage = config.package as String
        if (!mixinPackage) {
            throw new GradleException("Client mixin config must declare a package.")
        }

        def listedMixins = (config.client ?: []).collect { it.toString() }
        def duplicateMixins = listedMixins.groupBy { it }.findAll { it.value.size() > 1 }.keySet().sort()
        def sourceFiles = fileTree(dir: sourceDir, include: "*.java").files
        def sourceBySimpleName = sourceFiles.collectEntries { sourceFile -> [(sourceFile.name.replaceFirst(/\.java$/, "")): sourceFile]
        }
        def expectedMixins = sourceBySimpleName.findAll { simpleName, sourceFile -> simpleName.endsWith("Mixin") || sourceFile.getText("UTF-8").contains("@Mixin")
        }.keySet().sort()

        def missingSources = listedMixins.findAll { !sourceBySimpleName.containsKey(it) }.sort()
        def unlistedSources = expectedMixins.findAll { !listedMixins.contains(it) }.sort()
        def listedWithoutMixinAnnotation = listedMixins.findAll { simpleName ->
            def sourceFile = sourceBySimpleName[simpleName]
            sourceFile != null && !sourceFile.getText("UTF-8").contains("@Mixin")
        }.sort()
        def packageFailures = listedMixins.findAll { simpleName ->
            def sourceFile = sourceBySimpleName[simpleName]
            sourceFile != null && !sourceFile.getText("UTF-8").contains("package ${mixinPackage};")
        }.sort()

        def failures = []
        if (!duplicateMixins.isEmpty()) {
            failures.add("duplicate entries: ${duplicateMixins.join(', ')}")
        }
        if (!missingSources.isEmpty()) {
            failures.add("listed mixins without source files: ${missingSources.join(', ')}")
        }
        if (!unlistedSources.isEmpty()) {
            failures.add("mixin source files not listed in config: ${unlistedSources.join(', ')}")
        }
        if (!listedWithoutMixinAnnotation.isEmpty()) {
            failures.add("listed sources without @Mixin annotation: ${listedWithoutMixinAnnotation.join(', ')}")
        }
        if (!packageFailures.isEmpty()) {
            failures.add("listed sources outside configured package ${mixinPackage}: ${packageFailures.join(', ')}")
        }
        if (!failures.isEmpty()) {
            throw new GradleException("Client mixin config mismatch: ${failures.join('; ')}")
        }
    }
}

tasks.register("checkVulkanPackageBoundaries") {
    group = "verification"
    description = "Validates renderer package dependency boundaries."

    inputs.files(fileTree(dir: vulkanSourceDir, include: "**/*.java"))

    doLast {
        def forbiddenReferences = []
        def packageFailures = []
        def sourceDir = vulkanSourceDir.asFile
        fileTree(dir: vulkanSourceDir, include: "**/*.java").files.each { sourceFile ->
            def sourceText = sourceFile.getText("UTF-8")
            def packageMatcher = sourceText =~ /(?m)^\s*package\s+([^;]+);/
            if (!packageMatcher.find()) {
                packageFailures.add("${project.relativePath(sourceFile)}: missing package declaration")
            } else {
                def packageName = packageMatcher.group(1)
                if (!allowedVulkanPackages.contains(packageName)) {
                    packageFailures.add("${project.relativePath(sourceFile)}: package ${packageName} is outside allowed renderer packages")
                }
                def expectedRelativeDir = packageName.substring(vulkanPackageRoot.length()).replaceFirst(/^\./, "").replace(".", "/")
                def actualRelativeDir = sourceDir.toPath().relativize(sourceFile.parentFile.toPath()).toString().replace(File.separator, "/")
                if (actualRelativeDir != expectedRelativeDir) {
                    packageFailures.add("${project.relativePath(sourceFile)}: package ${packageName} does not match directory ${actualRelativeDir}")
                }
            }
            sourceText.readLines().eachWithIndex { line, index ->
                def importsMixinPackage = line ==~ /\s*import\s+com\.temotskipa\.vulkanimprovement\.mixin\.client(\..*)?;.*/
                def referencesMixinPackage = line.contains("com.temotskipa.vulkanimprovement.mixin.client")
                if (importsMixinPackage || referencesMixinPackage) {
                    forbiddenReferences.add("${project.relativePath(sourceFile)}:${index + 1}")
                }
            }
        }

        if (!packageFailures.isEmpty()) {
            throw new GradleException("renderer package layout mismatch: ${packageFailures.join(', ')}")
        }
        if (!forbiddenReferences.isEmpty()) {
            throw new GradleException("renderer packages under client.vulkan must not depend on mixin.client: ${forbiddenReferences.join(', ')}")
        }
    }
}

tasks.register("compileShaderSpirv") {
    group = "build"
    description = "Compiles the mod's GLSL shaders to SPIR-V for packaged client resources when glslangValidator is available."

    def shaderFiles = fileTree(dir: shaderSourceRoot, include: "*/*.glsl")
    def generatedResourceRoot = layout.buildDirectory.dir("generated/resources/shader-spirv")
    inputs.files(shaderFiles)
    inputs.property("releaseBuild", releaseBuild)
    inputs.property("requireShaderValidator", requireShaderValidator)
    outputs.dir(generatedResourceRoot)

    doLast {
        def validator = findGlslangValidator()
        if (validator == null) {
            def message = "glslangValidator not found; skipping SPIR-V generation. Runtime shaderc compilation remains available for development builds. Use -Pvim.requireShaderValidator=true or -Pvim.releaseBuild=true to require it."
            if (requireShaderValidatorTool()) {
                throw new GradleException(message)
            }
            logger.lifecycle(message)
            return
        }

        def resourceRoot = generatedResourceRoot.get().asFile
        shaderFiles.files.sort { it.path }.each { File shaderFile ->
            def stage = shaderStage(shaderFile)
            // shaders/<family>/<name>.<stage>.glsl compiles to shaders/<family>/spirv/<name>.<stage>.spv, where the game looks for it.
            def spirvDir = new File(resourceRoot, "assets/vulkanimprovement/shaders/${shaderFile.parentFile.name}/spirv")
            spirvDir.mkdirs()
            def outputFile = new File(spirvDir, shaderFile.name.replaceFirst(/\.glsl$/, ".spv"))
            def process = new ProcessBuilder(validator as String,
                    "-V",
                    "--target-env",
                    "vulkan1.4",
                    "-S",
                    stage,
                    shaderFile.absolutePath,
                    "-o",
                    outputFile.absolutePath).redirectErrorStream(true).start()
            def output = process.inputStream.getText("UTF-8")
            process.waitFor()
            if (process.exitValue() != 0) {
                throw new GradleException("SPIR-V generation failed for ${project.relativePath(shaderFile)}:\n${output}")
            }
        }
    }
}

static def shaderStage(File shaderFile) {
    def stage = shaderFile.name.endsWith(".task.glsl") ? "task" : shaderFile.name.endsWith(".mesh.glsl") ? "mesh" : shaderFile.name.endsWith(".frag.glsl") ? "frag" : shaderFile.name.endsWith(".comp.glsl") ? "comp" : null
    if (stage == null) {
        throw new GradleException("Unknown shader stage for ${shaderFile.name}")
    }
    return stage
}

static def findGlslangValidator() {
    List<String> candidates = []
    def vulkanSdk = System.getenv("VULKAN_SDK")
    if (vulkanSdk != null && !vulkanSdk.isBlank()) {
        candidates.add(new File(vulkanSdk, "Bin/glslangValidator.exe").absolutePath)
        candidates.add(new File(vulkanSdk, "bin/glslangValidator").absolutePath)
    }
    candidates.add("glslangValidator")
    candidates.add("glslangValidator.exe")
    return candidates.find { String candidate ->
        try {
            def process = new ProcessBuilder(candidate, "--version")
                    .redirectErrorStream(true)
                    .start()
            process.waitFor(5, TimeUnit.SECONDS) && process.exitValue() == 0
        } catch (IOException ignored) {
            false
        }
    }
}

tasks.named("processClientResources") {
    dependsOn tasks.named("compileShaderSpirv")
}

tasks.named("compileClientJava") {
    dependsOn tasks.named("compileShaderSpirv")
}

tasks.register("checkShaders") {
    group = "verification"
    description = "Validates the mod's GLSL shaders with glslangValidator when available."

    def shaderFiles = fileTree(dir: shaderSourceRoot, include: "*/*.glsl")
    inputs.files(shaderFiles)
    inputs.property("requireShaderValidator", requireShaderValidator)
    inputs.property("releaseBuild", releaseBuild)
    outputs.dir(layout.buildDirectory.dir("validated-shaders"))

    doLast {
        def required = requireShaderValidatorTool()
        def validator = findGlslangValidator()

        if (validator == null) {
            def message = "glslangValidator not found; skipping shader validation. Use -Pvim.requireShaderValidator=true or -Pvim.releaseBuild=true to require it."
            if (required) {
                throw new GradleException(message)
            }
            logger.lifecycle(message)
            return
        }

        def outputRoot = layout.buildDirectory.dir("validated-shaders").get().asFile
        shaderFiles.files.sort { it.path }.each { File shaderFile ->
            def outputDir = new File(outputRoot, shaderFile.parentFile.name)
            outputDir.mkdirs()
            def outputFile = new File(outputDir, shaderFile.name.replaceFirst(/\.glsl$/, ".spv"))
            def process = new ProcessBuilder(validator as String,
                    "-V",
                    "--target-env",
                    "vulkan1.4",
                    "-S",
                    shaderStage(shaderFile),
                    shaderFile.absolutePath,
                    "-o",
                    outputFile.absolutePath).redirectErrorStream(true).start()
            def output = process.inputStream.getText("UTF-8")
            process.waitFor()
            if (process.exitValue() != 0) {
                throw new GradleException("Shader validation failed for ${project.relativePath(shaderFile)}:\n${output}")
            }
        }
    }
}

tasks.register("checkTerrainLayoutManifest") {
    group = "verification"
    description = "Validates that terrain CPU layout constants match terrain shader layout assumptions."

    def shaderFiles = fileTree(dir: terrainShaderSourceDir, include: "*.glsl")
    inputs.file(terrainGpuLayoutSource)
    inputs.files(shaderFiles)

    doLast {
        def layoutSource = terrainGpuLayoutSource.asFile.getText("UTF-8")
        Map<String, Integer> constants = [:]
        def matcher = layoutSource =~ /(?:static\s+final\s+)?int\s+([A-Z0-9_]+)\s*=\s*(Integer\.BYTES|\d+);/
        matcher.each { List<String> match -> constants[match[1]] = match[2] == "Integer.BYTES" ? Integer.BYTES : match[2].toInteger()
        }

        def requiredConstants = ["SECTION_METADATA_STRIDE",
                                 "MESHLET_HEADER_STRIDE",
                                 "VISIBLE_MESHLET_RECORD_STRIDE",
                                 "TERRAIN_WORK_QUEUE_COUNTER_BYTES",
                                 "TERRAIN_WORK_QUEUE_RECORD_STRIDE",
                                 "TERRAIN_MESH_TASK_COMMAND_STRIDE",
                                 "TERRAIN_MESH_TASK_COMMAND_CAPACITY",
                                 "TERRAIN_MESH_TASK_COMMAND_PUSH_CONSTANT_BYTES",
                                 "VISIBILITY_WORKGROUP_SIZE",
                                 "MATERIAL_RECORD_STRIDE",
                                 "MATERIAL_TABLE_CAPACITY",
                                 "TERRAIN_PUSH_CONSTANT_BYTES",
                                 "TARGET_VERTICES_PER_MESHLET",
                                 "TARGET_TRIANGLES_PER_INDEXED_MESHLET",
                                 "MAX_MESH_OUTPUT_VERTICES",
                                 "MAX_MESH_OUTPUT_PRIMITIVES",
                                 "MESHLETS_PER_TASK",
                                 "TASK_RECORD_PAGE_BITS",
                                 "MAX_PAGE_MESHLETS",
                                 "TASK_WORKGROUP_SIZE",
                                 "SECTION_PAGES_PUSH_CONSTANT_BYTES",
                                 "SECTION_PAGES_WORKGROUP_SIZE",
                                 "SECTION_PAGES_LAYERS",
                                 "SECTION_PAGES_DISTANCES",
                                 "BLOCK_VERTEX_STRIDE",
                                 "INDEXED_TRIANGLES_FLAG",
                                 "NORMALIZED_INDEX_STRIDE"]
        def missingConstants = requiredConstants.findAll { !constants.containsKey(it) }
        if (!missingConstants.isEmpty()) {
            throw new GradleException("Terrain layout constants missing from TerrainGpuLayout: ${missingConstants.join(', ')}")
        }

        def shaderDir = terrainShaderSourceDir.asFile
        def taskShader = new File(shaderDir, "mesh_terrain.task.glsl").getText("UTF-8")
        def meshShader = new File(shaderDir, "mesh_terrain.mesh.glsl").getText("UTF-8")
        def fragmentShader = new File(shaderDir, "mesh_terrain.frag.glsl").getText("UTF-8")
        def commandShader = new File(shaderDir, "mesh_task_command.comp.glsl").getText("UTF-8")
        def sectionPagesShader = new File(shaderDir, "visible_section_pages.comp.glsl").getText("UTF-8")
        def normalize = { value -> value.replaceAll(/\s+/, " ").trim() }
        def requireText = { label, text, expected ->
            if (!text.contains(expected)) {
                throw new GradleException("Terrain layout mismatch in ${label}; expected text: ${expected}")
            }
        }
        def requireNormalizedText = { label, text, expected ->
            if (!normalize(text).contains(normalize(expected))) {
                throw new GradleException("Terrain layout mismatch in ${label}; expected layout: ${expected}")
            }
        }

        requireText("mesh terrain shader",
                meshShader,
                "layout(triangles, max_vertices = ${constants.MAX_MESH_OUTPUT_VERTICES}, max_primitives = ${constants.MAX_MESH_OUTPUT_PRIMITIVES}) out;")
        requireText("mesh terrain shader",
                meshShader,
                "const int INDEXED_TRIANGLES_FLAG = ${constants.INDEXED_TRIANGLES_FLAG};")
        requireText("mesh terrain shader",
                meshShader,
                "const int MATERIAL_TABLE_CAPACITY = ${constants.MATERIAL_TABLE_CAPACITY};")
        requireText("mesh terrain shader",
                meshShader,
                "uint(clamp(header.indexCount, 0, ${constants.MAX_MESH_OUTPUT_VERTICES}))")
        requireText("mesh terrain shader",
                meshShader,
                "uint(clamp(header.vertexCount, 0, ${constants.MAX_MESH_OUTPUT_VERTICES}))")
        requireNormalizedText("mesh terrain shader",
                meshShader,
                "struct MeshletHeader { int sectionX; int sectionY; int sectionZ; int layer; int firstVertex; int vertexCount; int firstIndex; int indexCount; uint64_t vertexByteOffset; uint64_t indexByteOffset; int vertexBytes; int indexBytes; int flags0; int materialId; vec3 boundsMin; vec3 boundsMax; int facing; int reserved0; };")
        requireNormalizedText("task terrain shader",
                taskShader,
                "struct MeshletHeader { int sectionX; int sectionY; int sectionZ; int layer; int firstVertex; int vertexCount; int firstIndex; int indexCount; uint64_t vertexByteOffset; uint64_t indexByteOffset; int vertexBytes; int indexBytes; int flags0; int materialId; vec3 boundsMin; vec3 boundsMax; int facing; int reserved0; };")
        def taskPayloadStruct = "struct TaskPayload { float meshletVisibility; uint meshletCount; uint meshlets[MESHLETS_PER_TASK]; };"
        requireNormalizedText("task terrain shader", taskShader, taskPayloadStruct)
        requireNormalizedText("mesh terrain shader", meshShader, taskPayloadStruct)
        requireText("task terrain shader", taskShader, "const uint MESHLETS_PER_TASK = ${constants.MESHLETS_PER_TASK}u;")
        requireText("mesh terrain shader", meshShader, "const uint MESHLETS_PER_TASK = ${constants.MESHLETS_PER_TASK}u;")
        requireText("task terrain shader", taskShader, "const uint TASK_RECORD_PAGE_BITS = ${constants.TASK_RECORD_PAGE_BITS}u;")
        requireText("visibility pass shader", commandShader, "const uint TASK_RECORD_PAGE_BITS = ${constants.TASK_RECORD_PAGE_BITS}u;")
        // One invocation tests one meshlet, and the kept ones are marked in one 32-bit mask.
        if (constants.MESHLETS_PER_TASK != constants.TASK_WORKGROUP_SIZE || constants.MESHLETS_PER_TASK > 32) {
            throw new GradleException("A task must test its meshlets one per invocation, at most 32: MESHLETS_PER_TASK=${constants.MESHLETS_PER_TASK}, TASK_WORKGROUP_SIZE=${constants.TASK_WORKGROUP_SIZE}")
        }
        // The bits above a record's page count the page's tasks.
        if (constants.MAX_PAGE_MESHLETS != constants.MESHLETS_PER_TASK << (32 - constants.TASK_RECORD_PAGE_BITS)) {
            throw new GradleException("MAX_PAGE_MESHLETS must be as many meshlets as a task record can count tasks for: ${constants.MESHLETS_PER_TASK << (32 - constants.TASK_RECORD_PAGE_BITS)}")
        }
        requireText("task terrain shader", taskShader, "layout(local_size_x = ${constants.TASK_WORKGROUP_SIZE}) in;")
        requireText("task terrain shader", taskShader, "const uint CULL_BACK_FACING_MESHLETS = ${constants.CULL_BACK_FACING_MESHLETS}u;")
        requireText("task terrain shader", taskShader, "const uint CULL_MESHLETS_OUTSIDE_VIEW = ${constants.CULL_MESHLETS_OUTSIDE_VIEW}u;")
        requireText("mesh terrain shader", meshShader, "const uint CULL_MESHLET_FRUSTUM_IN_MESH_STAGE = ${constants.CULL_MESHLET_FRUSTUM_IN_MESH_STAGE}u;")
        requireNormalizedText("mesh terrain shader",
                meshShader,
                "struct BlockVertex { vec3 position; uint color; vec2 uv0; uint uv2; };")
        requireNormalizedText("mesh terrain shader",
                meshShader,
                "struct MaterialRecord { int materialId; int flags; int blockAtlasWidth; int blockAtlasHeight; int blockAtlasBaseMip; int blockAtlasMipLevels; int lightmapWidth; int lightmapHeight; int normalTextureIndex; int specularTextureIndex; int emissionTextureIndex; int tintFlags; int alphaMode; int renderLayerOrdinal; int materialDomain; int reserved0; };")
        requireNormalizedText("mesh terrain shader",
                meshShader,
                "layout(buffer_reference, scalar, buffer_reference_align = 4) readonly buffer MaterialTable { MaterialRecord records[]; };")
        requireNormalizedText("task terrain shader",
                taskShader,
                "struct VisibleMeshletRecord { uint meshletIndex; float visibility; };")
        requireNormalizedText("task terrain shader",
                taskShader,
                "struct TerrainWorkQueueRecord { uint meshletIndex; uint layerOrdinal; uint lodLevel; uint flags; };")
        requireNormalizedText("task terrain shader",
                taskShader,
                "layout(buffer_reference, scalar, buffer_reference_align = 4) readonly buffer TerrainWorkQueue { uint producedCount; uint consumedCount; uint droppedCount; uint reserved; TerrainWorkQueueRecord records[]; };")

        def pushConstantBlock = "layout(push_constant, scalar) uniform TerrainPushConstants { uint64_t meshletHeaders; uint64_t vertexPayload; uint64_t indexPayload; uint64_t debugCounters; uint64_t visibleMeshlets; uint64_t workQueue; uint64_t materialTable; uint64_t pageTable; uint meshletCount; uint cullFlags; uint meshletOffset; int layerOrdinal; ivec4 cameraBlock; vec4 cameraOffset; vec4 cameraRight; vec4 cameraUp; vec4 cameraForward; vec4 projection; } pc;"
        requireNormalizedText("task terrain shader", taskShader, pushConstantBlock)
        requireNormalizedText("mesh terrain shader", meshShader, pushConstantBlock)
        requireText("task terrain shader", taskShader, "TerrainWorkQueue queue = TerrainWorkQueue(pc.workQueue);")
        requireNormalizedText("mesh-task command shader",
                commandShader,
                "struct MeshTaskCommand { uint groupCountX; uint groupCountY; uint groupCountZ; };")
        requireNormalizedText("mesh-task command shader",
                commandShader,
                "layout(push_constant, scalar) uniform CommandPushConstants { uint64_t pageTable; uint64_t visiblePages; uint64_t meshTaskCommands; uint64_t counters; uint inputOffset; uint outputOffset; uint pageCount; uint commandIndex; uint reserved0; uint reserved1; uint reserved2; uint reserved3; ivec4 cameraBlock; vec4 cameraOffset; vec4 cameraRight; vec4 cameraUp; vec4 cameraForward; vec4 projection; } pc;")
        requireText("mesh-task command shader", commandShader, "layout(local_size_x = ${constants.VISIBILITY_WORKGROUP_SIZE}) in;")
        requireText("mesh-task command shader", commandShader, "uint drawn = atomicAdd(commands.commands[pc.commandIndex].groupCountX, 1u);")
        requireText("mesh-task command shader", commandShader, "list.records[pc.outputOffset + drawn] = visible;")
        requireText("task terrain shader", taskShader, "ResidentPage page = PageTable(pc.pageTable).pages[record.meshletIndex & TASK_RECORD_PAGE_MASK];")
        requireText("task terrain shader", taskShader, "uint first = (record.meshletIndex >> TASK_RECORD_PAGE_BITS) * MESHLETS_PER_TASK;")
        requireText("mesh-task command shader", commandShader, "ResidentPage page = PageTable(pc.pageTable).pages[visible.pageIndex & ((1u << TASK_RECORD_PAGE_BITS) - 1u)];")
        requireText("task terrain shader", taskShader, "EmitMeshTasksEXT(kept, 1, 1);")
        requireText("mesh terrain shader", meshShader, "meshlets.headers[taskPayload.meshlets[gl_WorkGroupID.x]]")
        def residentPageStruct = "struct ResidentPage { uint64_t sectionNode; int sectionX; int sectionY; int sectionZ; int layer; int firstMeshlet; int meshletCount; int estimatedVertices; int estimatedMeshlets; int vertexBytes; int indexBytes; uint64_t vertexByteOffset; uint64_t indexByteOffset; int fadeStart; int customIndexBuffer; int reserved1; int reserved2; };"
        requireNormalizedText("task terrain shader", taskShader, residentPageStruct)
        requireNormalizedText("mesh-task command shader", commandShader, residentPageStruct)
        requireNormalizedText("visible section pages shader", sectionPagesShader, residentPageStruct)
        requireText("visible section pages shader", sectionPagesShader, "const uint MESHLETS_PER_TASK = ${constants.MESHLETS_PER_TASK}u;")
        requireText("visible section pages shader", sectionPagesShader, "const uint TASK_RECORD_PAGE_BITS = ${constants.TASK_RECORD_PAGE_BITS}u;")
        requireText("visible section pages shader", sectionPagesShader, "const int MAX_PAGE_MESHLETS = ${constants.MAX_PAGE_MESHLETS};")
        requireText("visible section pages shader", sectionPagesShader, "const uint LAYERS = ${constants.SECTION_PAGES_LAYERS}u;")
        requireText("visible section pages shader", sectionPagesShader, "const uint DISTANCES = ${constants.SECTION_PAGES_DISTANCES}u;")
        requireText("visible section pages shader", sectionPagesShader, "layout(local_size_x = ${constants.SECTION_PAGES_WORKGROUP_SIZE}) in;")
        requireNormalizedText("visible section pages shader", sectionPagesShader, "struct VisibleMeshletRecord { uint meshletIndex; float visibility; };")
        // The counters come first in a frame's data, as SECTION_PAGES_COUNTER_RECORDS says.
        requireNormalizedText("visible section pages shader", sectionPagesShader, "buffer FrameData { uint distanceTasks[LAYERS * DISTANCES]; uint distanceCursors[LAYERS * DISTANCES]; uint sectionsInView[]; };")
        requireNormalizedText("visible section pages shader", sectionPagesShader, "layout(push_constant, scalar) uniform SectionPagePushConstants { uint64_t pageTable; uint64_t records; uint64_t meshTaskCommands; uint frameRecord; uint pass; ivec4 boxMin; ivec4 boxSize; ivec4 cameraSection; uvec4 layerOutput; uvec4 layerCommand; } pc;")
        if (constants.SECTION_PAGES_PUSH_CONSTANT_BYTES != Long.BYTES * 3 + Integer.BYTES * 2 + Integer.BYTES * 4 * 5) {
            throw new GradleException("TerrainGpuLayout.SECTION_PAGES_PUSH_CONSTANT_BYTES must cover the GPU-driven pass's push constants.")
        }
        if (constants.SECTION_METADATA_STRIDE != Long.BYTES * 3 + Integer.BYTES * 14) {
            throw new GradleException("TerrainGpuLayout.SECTION_METADATA_STRIDE must match the ResidentPage record the shaders read.")
        }
        requireText("mesh terrain shader", meshShader, "materialFlags = uint(materials.records[materialIndex].flags);")
        requireText("mesh terrain shader", meshShader, "layout(location = 3) out flat uint meshMaterialFlags[];")
        requireText("fragment terrain shader", fragmentShader, "layout(location = 3) flat in uint meshMaterialFlags;")
        requireText("mesh terrain shader", meshShader, "vec4 projectRelative(vec3 relative)")
        requireText("mesh terrain shader", meshShader, "gl_MeshVerticesEXT[vertex].gl_Position = projectRelative(relative);")
        if (meshShader.contains("viewZ * 0.2") || meshShader.contains("projectDepth(")) {
            throw new GradleException("Terrain mesh shader must use Minecraft's camera projection matrix, not a hand-rolled clip-space depth.")
        }

        if (constants.BLOCK_VERTEX_STRIDE != 28) {
            throw new GradleException("TerrainGpuLayout.BLOCK_VERTEX_STRIDE must match scalar BlockVertex layout size 28.")
        }
        if (constants.NORMALIZED_INDEX_STRIDE != Integer.BYTES) {
            throw new GradleException("TerrainGpuLayout.NORMALIZED_INDEX_STRIDE must remain ${Integer.BYTES} for shader uint index payloads.")
        }
        if (constants.MESHLET_HEADER_STRIDE != Long.BYTES * 2 + Integer.BYTES * 12 + Float.BYTES * 6 + Integer.BYTES * 2) {
            throw new GradleException("TerrainGpuLayout.MESHLET_HEADER_STRIDE does not match MeshletHeader layout.")
        }
        if (constants.VISIBLE_MESHLET_RECORD_STRIDE != Integer.BYTES + Float.BYTES) {
            throw new GradleException("TerrainGpuLayout.VISIBLE_MESHLET_RECORD_STRIDE does not match VisibleMeshletRecord layout.")
        }
        if (constants.TERRAIN_WORK_QUEUE_COUNTER_BYTES != Integer.BYTES * 4) {
            throw new GradleException("TerrainGpuLayout.TERRAIN_WORK_QUEUE_COUNTER_BYTES must cover four uint counters.")
        }
        if (constants.TERRAIN_WORK_QUEUE_RECORD_STRIDE != Integer.BYTES * 4) {
            throw new GradleException("TerrainGpuLayout.TERRAIN_WORK_QUEUE_RECORD_STRIDE must match the four-int work queue record.")
        }
        if (constants.TERRAIN_MESH_TASK_COMMAND_STRIDE != Integer.BYTES * 3) {
            throw new GradleException("TerrainGpuLayout.TERRAIN_MESH_TASK_COMMAND_STRIDE must match VkDrawMeshTasksIndirectCommandEXT.")
        }
        if (constants.TERRAIN_MESH_TASK_COMMAND_CAPACITY <= 0) {
            throw new GradleException("TerrainGpuLayout.TERRAIN_MESH_TASK_COMMAND_CAPACITY must be positive.")
        }
        if (constants.TERRAIN_MESH_TASK_COMMAND_PUSH_CONSTANT_BYTES != Long.BYTES * 4 + Integer.BYTES * 8 + Float.BYTES * 4 * 6) {
            throw new GradleException("TerrainGpuLayout.TERRAIN_MESH_TASK_COMMAND_PUSH_CONSTANT_BYTES must cover the visibility pass's push constants.")
        }
        if (constants.MATERIAL_RECORD_STRIDE != Integer.BYTES * 16) {
            throw new GradleException("TerrainGpuLayout.MATERIAL_RECORD_STRIDE must match the 16-int default material record.")
        }
        if (constants.MATERIAL_TABLE_CAPACITY <= 0) {
            throw new GradleException("TerrainGpuLayout.MATERIAL_TABLE_CAPACITY must be positive.")
        }

        def minimumPushConstantBytes = Long.BYTES * 8 + Integer.BYTES * 4 + Float.BYTES * 4 * 6
        if (constants.TERRAIN_PUSH_CONSTANT_BYTES < minimumPushConstantBytes || constants.TERRAIN_PUSH_CONSTANT_BYTES % Long.BYTES != 0) {
            throw new GradleException("TerrainGpuLayout.TERRAIN_PUSH_CONSTANT_BYTES must cover the terrain push constant block and stay ${Long.BYTES}-byte aligned.")
        }
    }
}

// Some checks load LWJGL, which the game's JVM arguments let use its current memory backend.
