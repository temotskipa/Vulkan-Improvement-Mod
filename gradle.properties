# Done to increase the memory available to Gradle.
org.gradle.jvmargs=-Xmx4G
# Fabric Properties
# check these on https://modmuss50.me/fabric.html
minecraft_version=26.4-snapshot-5
# The version Fabric Loader reports for that build. A snapshot is not reported under its own name:
# 26.4-snapshot-5 is 26.4-alpha.5 to the loader, and the mod's metadata has to ask for that.
minecraft_dependency=26.4-alpha.5
loader_version=0.20.1
# Mod Properties
mod_version=0.1.0
maven_group=com.temotskipa
archives_base_name=vulkan-improvement-mod
# Dependencies
# check this on https://modmuss50.me/fabric.html
fabric_version=0.165.0+26.4
